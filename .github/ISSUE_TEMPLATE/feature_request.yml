name: Feature request
description: Suggest a new feature or improvement for Sundial
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem you're trying to solve — that's more useful than prescribing a specific solution.

        Search existing requests first: https://github.com/ypk46/sp-sundial/issues?q=is%3Aissue+label%3Aenhancement
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Sundial currently makes hard or impossible?
      placeholder: 'I want to see how much time I spent on a specific project over the last quarter, but...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: The outcome you'd like to see. Don't worry about implementation details — describe the experience.
      placeholder: 'It would be great if I could select a date range and a project and see a breakdown by day...'
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other tools you've tried.
      placeholder: 'I tried exporting from Super Productivity and charting in a spreadsheet, but...'
    validations:
      required: false
