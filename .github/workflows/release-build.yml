name: release-build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      # Resolve the release id: use the release event payload when triggered by
      # release-please, otherwise look up the release by tag from a dispatch.
      - name: Resolve release id (release event)
        id: release-event
        if: github.event_name == 'release'
        run: echo "id=${{ github.event.release.id }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Resolve release id (dispatch)
        id: release-dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "id=$(gh release view '${{ inputs.tag }}' --json id --jq '.id')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Combine release id
        id: release
        run: echo "id=${{ steps.release-event.outputs.id || steps.release-dispatch.outputs.id }}" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Attach to the existing release by id — preserves the changelog body
          # that release-please wrote. tagName/releaseName are ignored when
          # releaseId is set.
          releaseId: ${{ steps.release.outputs.id }}
          args: ${{ matrix.args }}
